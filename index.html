<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06a9c7">

  <title>QazaqAI</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f7fbfd;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      color: #0799bb;
      font-size: 38px;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #dff8fb;
      color: #087e92;
      font-weight: bold;
    }

    p {
      color: #475569;
      font-size: 18px;
      line-height: 1.5;
      max-width: 420px;
    }

    .open-button {
      display: block;
      width: min(100%, 420px);
      margin-top: 20px;
      padding: 18px 24px;
      border-radius: 18px;
      background: #069fc1;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 8px 24px rgba(0, 159, 193, 0.25);
    }

    .small {
      margin-top: 20px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="app">
    <img class="logo" src="./icon-512.png" alt="QazaqAI">

    <h1>QazaqAI</h1>

    <div class="badge">AI ТӘЛІМГЕР</div>

    <p>
      Қазақ тілін бірге үйренейік!<br>
      Интерактивті қазақ тілі көмекшісі.
    </p>

    <a
      class="open-button"
      href="https://qazaqai.ai.studio/"
    >
      QazaqAI-ды ашу
    </a>

    <div class="small">
      Қазақ тілін үйренуге арналған цифрлық көмекші
    </div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
